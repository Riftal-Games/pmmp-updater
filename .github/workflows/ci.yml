name: CI

# Pull requests gate every merge. Pushes are watched on main only, so a branch push
# and its pull request do not run twice for the same commit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: tools and skills
    runs-on: [self-hosted, linux, riftal]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node version
        run: |
          node --version
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'

      - name: Skills keep the shared failure block
        run: node tools/skills-lint/lint.js

      - name: Tool tests
        run: node --test "tools/**/*.test.js"

      # Against Mojang's published docs, so a change in how Mojang lays out a tag fails
      # here before it fails a version run. Tags are cached under the runner user's
      # ~/.cache, outside the workspace, and reused across runs.
      - name: Live docs check
        env:
          RIFTAL_LIVE: "1"
        run: node --test --test-name-pattern=live "tools/**/*.test.js"

  # The package's own checks, as its upstream CI ran them. bedrock-protocol is the only
  # package with PHP checks of its own; the other three ship data.
  bedrock-protocol:
    name: bedrock-protocol PHP checks
    runs-on: [self-hosted, linux, riftal]
    timeout-minutes: 20
    env:
      PACKAGE: packages/bedrock-protocol
      # The image pmmp-core's codestyle job runs. The tree is mounted read-only and the
      # cache is off, because the image runs as root on a workspace that persists.
      PHP_CS_FIXER_IMAGE: ghcr.io/php-cs-fixer/php-cs-fixer:3.75.0-php8.3@sha256:3da587bc3019ebbfc8c917e512471a721ebbc634bbb2fcf2646ab4b6bf282224
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Run later by the image ID it reports, never by a tag, so a concurrent run on the
      # same daemon cannot swap the image under this one.
      - name: Build the PHP image
        run: docker build --progress=plain --iidfile "$RUNNER_TEMP/php-ci.iid" .github/php-ci

      - name: Run PHP-CS-Fixer
        timeout-minutes: 10
        run: docker run --rm --init -m 1g --cpus 1 -v "$(realpath "$PACKAGE"):/code:ro" -w /code "$PHP_CS_FIXER_IMAGE" fix --dry-run --diff --using-cache=no --show-progress=none

      - name: Install Composer dependencies
        timeout-minutes: 10
        run: bash .github/php-ci/run.sh "$PACKAGE" composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        timeout-minutes: 10
        run: bash .github/php-ci/run.sh "$PACKAGE" php vendor/bin/phpstan analyze --no-progress --memory-limit=2G

      - name: Run PHPUnit
        timeout-minutes: 10
        run: bash .github/php-ci/run.sh "$PACKAGE" php vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit
